name: CI

on:
  pull_request:
    branches:
      - develop
      - staging
      - production
  push:
    branches:
      - develop
      - staging
      - production

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'src/**'
              - 'public/**'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'vitest.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.mjs'
              - 'tailwind.config.ts'
              - 'postcss.config.mjs'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'

  backend-build:
    name: Backend build
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  backend-test:
    name: Backend test
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-lint:
    name: Frontend lint
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint

  frontend-build:
    name: Frontend build
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build

  frontend-test:
    name: Frontend test
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: E2E (Playwright)
    needs: [changes, backend-build, backend-test, frontend-build, frontend-test]
    if: |
      always() &&
      (needs.backend-build.result == 'success' || needs.backend-build.result == 'skipped') &&
      (needs.backend-test.result == 'success' || needs.backend-test.result == 'skipped') &&
      (needs.frontend-build.result == 'success' || needs.frontend-build.result == 'skipped') &&
      (needs.frontend-test.result == 'success' || needs.frontend-test.result == 'skipped') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: vehicle_pl_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
          E2E_DATABASE_URL: "mysql://root:test@127.0.0.1:3306/vehicle_pl_e2e"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  ci-success:
    name: CI success
    needs:
      - changes
      - backend-build
      - backend-test
      - frontend-lint
      - frontend-build
      - frontend-test
      - e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          set -euo pipefail
          check() {
            local name="$1"
            local result="$2"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "${name} failed (${result})"
              exit 1
            fi
          }
          check backend-build "${{ needs.backend-build.result }}"
          check backend-test "${{ needs.backend-test.result }}"
          check frontend-lint "${{ needs.frontend-lint.result }}"
          check frontend-build "${{ needs.frontend-build.result }}"
          check frontend-test "${{ needs.frontend-test.result }}"
          check e2e "${{ needs.e2e.result }}"
          echo "All CI checks passed."
