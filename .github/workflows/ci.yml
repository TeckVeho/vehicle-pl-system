name: CI

on:
  pull_request:
    branches:
      - develop
      - staging
      - production
  push:
    branches:
      - develop
      - staging
      - production

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'src/**'
              - 'public/**'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'vitest.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.mjs'
              - 'tailwind.config.ts'
              - 'postcss.config.mjs'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'

      - name: Backend — build & test
        if: steps.filter.outputs.backend == 'true' || github.event_name != 'pull_request'
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build
          npm test

      - name: Frontend — lint, build & test
        if: steps.filter.outputs.frontend == 'true' || github.event_name != 'pull_request'
        run: |
          npm ci
          npm run lint
          npm run build
          npm test

  e2e:
    name: E2E
    needs: ci
    if: |
      needs.ci.result == 'success' &&
      (needs.ci.outputs.backend == 'true' || needs.ci.outputs.frontend == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: vehicle_pl_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
          E2E_DATABASE_URL: "mysql://root:test@127.0.0.1:3306/vehicle_pl_e2e"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
