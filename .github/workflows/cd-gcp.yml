# GCP — deploy via Cloud Build when code is merged into develop | staging | production
#
# Triggers only on push to those branches (merge commit = push). PRs and other branches do not deploy.
# Path filter on push: backend/** and/or frontend/** → backend | frontend | full; neither → skip.
# workflow_dispatch: manual deploy (optional); same branch must be develop | staging | production.
#
# GitHub repo: TeckVeho/vehicle-pl-system (WIF attribute-condition must match)
#
# Credentials: repository Secrets (no admin needed for Environments):
#   GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT
# Repository Variables (per branch suffix):
#   GCP_NEXT_PUBLIC_API_URL_DEVELOP / GCP_NEXT_PUBLIC_BASE_URL_DEVELOP
#   GCP_NEXT_PUBLIC_API_URL_STAGING / GCP_NEXT_PUBLIC_BASE_URL_STAGING
#   GCP_NEXT_PUBLIC_API_URL_PRODUCTION / GCP_NEXT_PUBLIC_BASE_URL_PRODUCTION
# Optional: GCP_IMAGE_TAG (repo variable)
#
# One-shot setup: bash google-cloud/scripts/setup-github-actions-cicd.sh
# Manual WIF/IAM: google-cloud/cloudbuild/GITHUB_ACTIONS_WIF.md

name: CD GCP

concurrency:
  group: cd-gcp-${{ github.ref_name }}
  cancel-in-progress: false

on:
  push:
    branches:
      - develop
      - staging
      - production
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'full = API + web; backend = API image only; frontend = web image only'
        type: choice
        options:
          - full
          - backend
          - frontend
        default: full

permissions:
  contents: read
  id-token: write

jobs:
  resolve-mode:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/production'
    outputs:
      build_mode: ${{ steps.resolve.outputs.build_mode }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        if: github.event_name == 'push'
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'src/**'
              - 'public/**'
              - 'Dockerfile.prod'
              - 'next.config.mjs'
              - 'package.json'
              - 'package-lock.json'
              - 'tailwind.config.ts'
              - 'postcss.config.mjs'
              - 'components.json'
              - 'tsconfig.json'

      - id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build_mode=${{ inputs.build_mode }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BE="${{ steps.filter.outputs.backend }}"
          FE="${{ steps.filter.outputs.frontend }}"
          if [ "${BE}" = "true" ] && [ "${FE}" = "true" ]; then
            echo "build_mode=full" >> "$GITHUB_OUTPUT"
          elif [ "${BE}" = "true" ]; then
            echo "build_mode=backend" >> "$GITHUB_OUTPUT"
          elif [ "${FE}" = "true" ]; then
            echo "build_mode=frontend" >> "$GITHUB_OUTPUT"
          else
            echo "build_mode=skip" >> "$GITHUB_OUTPUT"
          fi

  cloud-build:
    needs: resolve-mode
    if: needs.resolve-mode.outputs.build_mode != 'skip'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Resolve Cloud Build config
        id: cfg
        env:
          ENV_NAME: ${{ github.ref_name }}
          MODE: ${{ needs.resolve-mode.outputs.build_mode }}
        run: |
          set -euo pipefail
          echo "env_name=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          case "${ENV_NAME}" in
            production)
              case "${MODE}" in
                backend)
                  echo "cloudbuild_config=google-cloud/cloudbuild/cloudbuild.dev.api.yaml" >> "$GITHUB_OUTPUT"
                  ;;
                frontend)
                  echo "cloudbuild_config=google-cloud/cloudbuild/cloudbuild.dev.web.yaml" >> "$GITHUB_OUTPUT"
                  ;;
                full|*)
                  echo "cloudbuild_config=google-cloud/cloudbuild/cloudbuild.dev.yaml" >> "$GITHUB_OUTPUT"
                  ;;
              esac
              DEFAULT_TAG=prod
              SERVICE_SUFFIX=prod
              ;;
            staging)
              case "${MODE}" in
                backend)
                  echo "cloudbuild_config=google-cloud/cloudbuild/cloudbuild.dev.api.yaml" >> "$GITHUB_OUTPUT"
                  ;;
                frontend)
                  echo "cloudbuild_config=google-cloud/cloudbuild/cloudbuild.dev.web.yaml" >> "$GITHUB_OUTPUT"
                  ;;
                full|*)
                  echo "cloudbuild_config=google-cloud/cloudbuild/cloudbuild.dev.yaml" >> "$GITHUB_OUTPUT"
                  ;;
              esac
              DEFAULT_TAG=stage
              SERVICE_SUFFIX=stg
              ;;
            develop)
              case "${MODE}" in
                backend)
                  echo "cloudbuild_config=google-cloud/cloudbuild/cloudbuild.dev.api.yaml" >> "$GITHUB_OUTPUT"
                  ;;
                frontend)
                  echo "cloudbuild_config=google-cloud/cloudbuild/cloudbuild.dev.web.yaml" >> "$GITHUB_OUTPUT"
                  ;;
                full|*)
                  echo "cloudbuild_config=google-cloud/cloudbuild/cloudbuild.dev.yaml" >> "$GITHUB_OUTPUT"
                  ;;
              esac
              DEFAULT_TAG=dev
              SERVICE_SUFFIX=dev
              ;;
            *)
              echo "Internal error: unexpected ref_name=${ENV_NAME}" >&2
              exit 1
              ;;
          esac
          TAG="${{ vars.GCP_IMAGE_TAG }}"
          if [ -z "${TAG}" ]; then TAG="${DEFAULT_TAG}"; fi
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "service_suffix=${SERVICE_SUFFIX}" >> "$GITHUB_OUTPUT"
          case "${ENV_NAME}" in
            develop)
              API_URL="${{ vars.GCP_NEXT_PUBLIC_API_URL_DEVELOP }}"
              BASE_URL="${{ vars.GCP_NEXT_PUBLIC_BASE_URL_DEVELOP }}"
              ;;
            staging)
              API_URL="${{ vars.GCP_NEXT_PUBLIC_API_URL_STAGING }}"
              BASE_URL="${{ vars.GCP_NEXT_PUBLIC_BASE_URL_STAGING }}"
              ;;
            production)
              API_URL="${{ vars.GCP_NEXT_PUBLIC_API_URL_PRODUCTION }}"
              BASE_URL="${{ vars.GCP_NEXT_PUBLIC_BASE_URL_PRODUCTION }}"
              ;;
          esac
          echo "api_url=${API_URL}" >> "$GITHUB_OUTPUT"
          echo "base_url=${BASE_URL}" >> "$GITHUB_OUTPUT"

      - name: Validate required GCP secrets
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          set -euo pipefail
          missing=
          [ -z "${GCP_PROJECT_ID}" ] && missing="${missing} GCP_PROJECT_ID"
          [ -z "${GCP_SERVICE_ACCOUNT}" ] && missing="${missing} GCP_SERVICE_ACCOUNT"
          [ -z "${GCP_WORKLOAD_IDENTITY_PROVIDER}" ] && missing="${missing} GCP_WORKLOAD_IDENTITY_PROVIDER"
          if [ -n "${missing}" ]; then
            echo "Missing repository secrets:${missing}"
            exit 1
          fi

      - name: Validate required Variables for full / frontend
        if: needs.resolve-mode.outputs.build_mode == 'full' || needs.resolve-mode.outputs.build_mode == 'frontend'
        run: |
          set -euo pipefail
          if [ -z "${{ steps.cfg.outputs.api_url }}" ] || [ -z "${{ steps.cfg.outputs.base_url }}" ]; then
            echo "build_mode '${{ needs.resolve-mode.outputs.build_mode }}' requires GCP_NEXT_PUBLIC_* repository Variables for branch '${{ github.ref_name }}'."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify Cloud Build access to target project
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          gcloud builds list --project="${PROJECT_ID}" --limit=1

      - name: gcloud builds submit
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          CONFIG: ${{ steps.cfg.outputs.cloudbuild_config }}
          TAG: ${{ steps.cfg.outputs.image_tag }}
          SERVICE_SUFFIX: ${{ steps.cfg.outputs.service_suffix }}
          API_URL: ${{ steps.cfg.outputs.api_url }}
          BASE_URL: ${{ steps.cfg.outputs.base_url }}
          MODE: ${{ needs.resolve-mode.outputs.build_mode }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          CORE_SUBS="_TAG=${TAG},_AR_PROJECT_ID=${PROJECT_ID},_DEPLOY_PROJECT_ID=${PROJECT_ID},_REPO=${PROJECT_ID}-docker"
          if [ "${MODE}" = "backend" ]; then
            gcloud builds submit --project="${PROJECT_ID}" --config="${CONFIG}" \
              --substitutions="${CORE_SUBS},_API_SERVICE=${PROJECT_ID}-api-${SERVICE_SUFFIX},_MIGRATE_JOB=${PROJECT_ID}-migrate-${SERVICE_SUFFIX}" .
          elif [ "${MODE}" = "frontend" ]; then
            gcloud builds submit --project="${PROJECT_ID}" --config="${CONFIG}" \
              --substitutions="${CORE_SUBS},_WEB_SERVICE=${PROJECT_ID}-web-${SERVICE_SUFFIX},_NEXT_PUBLIC_API_URL=${API_URL},_NEXT_PUBLIC_BASE_URL=${BASE_URL}" .
          else
            gcloud builds submit --project="${PROJECT_ID}" --config="${CONFIG}" \
              --substitutions="${CORE_SUBS},_API_SERVICE=${PROJECT_ID}-api-${SERVICE_SUFFIX},_WEB_SERVICE=${PROJECT_ID}-web-${SERVICE_SUFFIX},_MIGRATE_JOB=${PROJECT_ID}-migrate-${SERVICE_SUFFIX},_NEXT_PUBLIC_API_URL=${API_URL},_NEXT_PUBLIC_BASE_URL=${BASE_URL}" .
          fi
