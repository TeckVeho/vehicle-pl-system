# Cloud Build — dev images only (before first terraform apply)

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.prod'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_REPO}/izumi-vpl-api:${_TAG}'
      - '.'
    dir: 'backend'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_REPO}/izumi-vpl-api:${_TAG}'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.prod'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_BASE_URL=${_NEXT_PUBLIC_BASE_URL}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_REPO}/izumi-vpl-web:${_TAG}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_REPO}/izumi-vpl-web:${_TAG}'

substitutions:
  _REGION: asia-northeast1
  _REPO: izumi-vpl-docker
  _TAG: dev
  _AR_PROJECT_ID: ''
  _NEXT_PUBLIC_API_URL: 'https://izumi-vpl-api-dev-placeholder.run.app'
  _NEXT_PUBLIC_BASE_URL: 'https://izumi-vpl-web-dev-placeholder.run.app'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
