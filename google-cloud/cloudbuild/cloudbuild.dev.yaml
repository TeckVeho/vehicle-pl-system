# Cloud Build — dev images (API + web) → Artifact Registry (vehicle-pl-system)
#
# Submit from repo root:
#   bash google-cloud/scripts/cloud-build-submit.sh google-cloud/cloudbuild/cloudbuild.dev.yaml

steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        docker pull ${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_REPO}/izumi-vpl-api:${_TAG} || true
        docker build -f Dockerfile.prod \
          --cache-from ${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_REPO}/izumi-vpl-api:${_TAG} \
          -t ${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_REPO}/izumi-vpl-api:${_TAG} \
          .
    dir: 'backend'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_REPO}/izumi-vpl-api:${_TAG}'

  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        docker pull ${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_REPO}/izumi-vpl-web:${_TAG} || true
        docker build -f Dockerfile.prod \
          --build-arg NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL} \
          --build-arg NEXT_PUBLIC_BASE_URL=${_NEXT_PUBLIC_BASE_URL} \
          --cache-from ${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_REPO}/izumi-vpl-web:${_TAG} \
          -t ${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_REPO}/izumi-vpl-web:${_TAG} \
          .

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_REPO}/izumi-vpl-web:${_TAG}'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - '${_MIGRATE_JOB}'
      - '--project'
      - '${_DEPLOY_PROJECT_ID}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_REPO}/izumi-vpl-api:${_TAG}'
      - '--region'
      - '${_REGION}'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - '${_MIGRATE_JOB}'
      - '--project'
      - '${_DEPLOY_PROJECT_ID}'
      - '--region'
      - '${_REGION}'
      - '--wait'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_API_SERVICE}'
      - '--project'
      - '${_DEPLOY_PROJECT_ID}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_REPO}/izumi-vpl-api:${_TAG}'
      - '--region'
      - '${_REGION}'
      - '--no-invoker-iam-check'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_WEB_SERVICE}'
      - '--project'
      - '${_DEPLOY_PROJECT_ID}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_REPO}/izumi-vpl-web:${_TAG}'
      - '--region'
      - '${_REGION}'
      - '--no-invoker-iam-check'

substitutions:
  _REGION: asia-northeast1
  _REPO: izumi-vpl-docker
  _TAG: dev
  _AR_PROJECT_ID: ''
  _DEPLOY_PROJECT_ID: ''
  _API_SERVICE: izumi-vpl-api-dev
  _WEB_SERVICE: izumi-vpl-web-dev
  _MIGRATE_JOB: izumi-vpl-migrate-dev
  _NEXT_PUBLIC_API_URL: 'https://izumi-vpl-api-dev-placeholder.run.app'
  _NEXT_PUBLIC_BASE_URL: 'https://izumi-vpl-web-dev-placeholder.run.app'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_MEDIUM
